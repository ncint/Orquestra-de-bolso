<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orquestra de Bolso</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  /* Sistema visual: fundo azul-noite com vinheta suave; acentos
     quentes (âmbar/dourado) para contraste; cartões com profundidade. */
  :root {
    --bg: #12141d;
    --bg-2: #1a1d2b;
    --card: #232739;
    --card-hi: #2d3247;
    --line: #3a4056;
    --text: #f2f3f7;
    --text-dim: #a7abbd;
    --accent: #e8b04b;
    --accent-soft: rgba(232,176,75,.14);
  }
  @media (orientation: landscape) {
    body:not(.allow-landscape)::after {
      content: '📵 Roda o telemóvel para a vertical';
      position: fixed; inset: 0; background: #171a24; z-index: 99;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 600;
    }
  }
  /* Theremin: o campo cresce com o ecrã na horizontal — a app põe
     body.allow-landscape ao abrir o theremin e retira-o ao sair. */
  body.allow-landscape {
    height: auto; min-height: 100vh;
  }
  body.allow-landscape .theremin-field {
    min-height: 70vh;
  }
  body {
    margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--bg-2) 0%, var(--bg) 58%);
    background-attachment: fixed;
    color: var(--text); overscroll-behavior: none;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px 10px; display: flex; justify-content: space-between;
    align-items: center; flex: 0 0 auto;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  header strong {
    font-size: 17px; letter-spacing: .3px;
    background: linear-gradient(90deg, var(--text), #cdd2e4);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: #e06464; margin-right: 5px; vertical-align: middle;
         box-shadow: 0 0 0 3px rgba(224,100,100,.18); }
  .dot.on { background: #5fd68a; box-shadow: 0 0 0 3px rgba(95,214,138,.18); }
  .connected { font-size: 13px; color: var(--text-dim); }

  .screen { display: none; flex: 1 1 auto; flex-direction: column;
            width: 100%; padding: 0 16px 16px; min-height: 0; }
  .screen.active { display: flex; }

  button {
    font-family: inherit; font-weight: 600;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line);
    padding: 12px 16px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .08s, box-shadow .12s, background .12s;
  }
  button:active {
    transform: scale(.97);
    box-shadow: 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.03);
  }

  /* Ecrã de escolha */
  #screen-menu { justify-content: center; max-width: 460px; margin: 0 auto; }
  #screen-menu { gap: 2px; }
  .sorteio-btn {
    display: block; width: 100%; margin: 0 0 16px;
    font-size: 18px; padding: 18px;
    background: linear-gradient(135deg, #8a5d2b, #b8893a);
    border-color: #e8b04b;
    box-shadow: 0 4px 18px rgba(232,176,75,.25), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .menu-title {
    text-align: center; margin: 6px 0 14px;
  }
  .menu-title .t {
    display: block; font-size: 21px; font-weight: 700;
    letter-spacing: .4px;
  }
  .menu-title .s {
    display: block; font-size: 13px; color: var(--text-dim); margin-top: 4px;
  }
  .choose-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; font-size: 18px; padding: 16px;
    margin-bottom: 10px; text-align: left;
    position: relative; overflow: hidden;
  }
  .choose-btn .ico {
    font-size: 26px; flex: 0 0 auto;
    width: 46px; height: 46px; display: flex; align-items: center;
    justify-content: center; border-radius: 13px;
    background: var(--accent-soft);
  }
  .choose-btn .txt { flex: 1 1 auto; min-width: 0; }
  .choose-btn small { display: block; font-weight: 400; font-size: 12.5px;
                      color: var(--text-dim); margin-top: 3px; }
  /* Acento lateral por naipe */
  .choose-btn::before {
    content: ''; position: absolute; left: 0; top: 10%; bottom: 10%;
    width: 4px; border-radius: 0 4px 4px 0;
    background: var(--sec, var(--accent));
  }
  .choose-btn[data-inst="bells"]     { --sec: #7db8e8; }
  .choose-btn[data-inst="handpan"]   { --sec: #e8b04b; }
  .choose-btn[data-inst="fmbell"]    { --sec: #c9a8e8; }
  .choose-btn[data-inst="formant"]   { --sec: #e89dc4; }
  .choose-btn[data-inst="pad"]       { --sec: #9db8e8; }
  .choose-btn[data-inst="pluck"]     { --sec: #e8d47d; }
  .choose-btn[data-inst="djembe"]    { --sec: #c98a5d; }
  .choose-btn[data-inst="cymbal"]     { --sec: #d8c95d; }
  .choose-btn[data-inst="shaker"]    { --sec: #9dc9b8; }
  .choose-btn[data-inst="clap"]       { --sec: #e8b87d; }
  .choose-btn[data-inst="timbales"]   { --sec: #c97d7d; }
  .choose-btn[data-inst="theremin"]   { --sec: #9db8e8; }

  /* Ecrã de instrumento */
  #screen-instrument { max-width: 480px; margin: 0 auto; }
  .inst-title { text-align: center; margin: 6px 0 2px; font-size: 23px;
                font-weight: 700; letter-spacing: .3px; }
  .inst-sub { text-align: center; font-size: 13px; color: var(--text-dim);
              margin: 0 0 10px; }
  .audio-status { text-align: center; font-size: 13px; padding: 7px 14px;
                  border-radius: 999px; margin: 0 auto 12px; width: fit-content; }
  .audio-status.off { background: #4a2f2f; color: #ffb4a6; }
  .audio-status.on  { background: #274434; color: #a8e6b0; display: none; }
  .mode-row {
    display: flex; align-items: center; gap: 8px;
    margin: 0 auto 10px; max-width: 420px;
  }
  .mode-row .mode-label { font-size: 13px; opacity: .8; }
  .mode-btn {
    font-size: 13px; padding: 8px 12px; flex: 1 1 auto;
    background: var(--card);
  }
  .mode-btn.sel { background: #4a6bff; border-color: #4a6bff; }
  .motion-btn {
    display: block; width: 100%; margin: 0 auto 10px;
    font-size: 15px; padding: 12px; max-width: 420px;
    background: #5d4a8f; border-color: #8f7ac9;
  }
  .motion-btn.ok { background: #2e4a34; border-color: #4a9b6d; }
  .motion-btn.err { background: #5d3a3a; border-color: #9b4a4a; }

  .note-pads { display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
               flex: 1 1 auto; min-height: 0; }
  .note-pad {
    border: none; border-radius: 20px; color: #10131a;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 220px;
    transition: filter .06s, transform .08s, box-shadow .12s;
    touch-action: manipulation; user-select: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .note-pad:active { transform: scale(.97); }
  .note-pad.armed {
    outline: 5px solid var(--text);
    outline-offset: -5px;
    filter: brightness(1.18);
    box-shadow: 0 0 0 6px var(--accent-soft), 0 4px 14px rgba(0,0,0,.4);
  }
  .note-pad .note-name { font-size: 42px; font-weight: 800; line-height: 1; }
  .note-pad .note-hint { font-size: 13px; font-weight: 400; opacity: .7;
                         margin-top: 8px; }
  .note-pad.pressed { filter: brightness(1.55); }
  .note-pad.ringing { animation: ring .5s ease-out; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); }
    100% { box-shadow: 0 0 0 34px rgba(255,255,255,0); }
  }
  .back-btn { margin-top: 14px; font-size: 13px; padding: 9px 16px;
              align-self: center; background: transparent; color: var(--text-dim);
              border-color: transparent; box-shadow: none; }
  .volume-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 10px 14px;
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--line);
  }
  .volume-row label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .volume-row input[type="range"] { flex: 1 1 auto; accent-color: var(--accent); }
  /* Fundo inspirado no keffiyeh (lenço palestiniano): rede em
     xadrez diagonal sobre fundo escuro, construída com gradientes
     CSS — sem ficheiros de imagem. */
  .theremin-field {
    flex: 1 1 auto; min-height: 0; width: 100%;
    background: linear-gradient(#1c2030, #2a3050);
    border: 1px solid #46506a; border-radius: 20px;
    position: relative; overflow: hidden;
    touch-action: none; user-select: none;
  }
  .theremin-note {
    position: absolute; top: 0; bottom: 0; text-align: center;
    font-size: 14px; font-weight: 700;
    color: rgba(255,255,255,.75);
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .theremin-note.sel {
    color: #fff;
    background: rgba(255,255,255,.08);
  }
  .theremin-spot {
    position: absolute; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(125,184,232,.35);
    border: 2px solid #7db8e8;
    transform: translate(-50%, -50%);
    pointer-events: none; display: none;
  }
</style>
</head>
<body>
<header>
  <strong>🎼 Orquestra de Bolso</strong>
  <span class="connected"><span class="dot" id="dot"></span><span id="cnt">…</span></span>
</header>

<!-- Ecrã: escolha do instrumento -->
<div class="screen active" id="screen-menu">
  <div class="menu-title">
    <span class="t">Orquestra de Bolso</span>
    <span class="s">Carrega no dado e recebe o teu instrumento</span>
  </div>
  <button class="sorteio-btn" id="sorteioBtn">🎲 Sortear o meu instrumento</button>
  <!-- Escolha livre escondida por defeito (sorteio é a experiência

  <button class="choose-btn" data-inst="pad">

  <button class="choose-btn" data-inst="pluck">

  <button class="choose-btn" data-inst="theremin">

  </div><!-- /free-choice -->
</div>

<!-- Ecrã: instrumento com 2 notas -->
<div class="screen" id="screen-instrument">
  <h1 class="inst-title" id="instTitle"></h1>
  <p class="inst-sub" id="instSub"></p>
  <div class="audio-status off" id="audioOff">🔇 Toca num botão para activar o som</div>
  <div class="audio-status on" id="audioOn">🔊 Som activo</div>
  <p class="arm-hint" id="armHint">Toca numa nota para armar · Agita o telemóvel para tocar</p>
  <div class="mode-row">
    <span class="mode-label">Modo:</span>
    <button class="mode-btn sel" id="modeShake">📳 Abanar</button>
    <button class="mode-btn" id="modeTap">👆 Toque</button>
  </div>
  <button class="motion-btn" id="motionBtn" style="display:none">
    📳 Ativar agitar no iPhone
  </button>
  <div class="note-pads" id="pads"></div>
  <div class="volume-row">
    <label for="volSlider">🔊 Volume</label>
    <input type="range" id="volSlider" min="0" max="1.5" step="0.01" value="1">
  </div>
  <button class="back-btn" id="backBtn">↩ Trocar de instrumento</button>
</div>

<script>
'use strict';

/* ================================================================
   1. CONFIGURAÇÃO MUSICAL (central — única fonte das notas)
   Estrutura preparada para, no futuro, a configuração de sessão
   (escala + atribuição de notas por lugar/QR code) substituir
   estes valores por outros recebidos do servidor.
   ================================================================ */

const SCALES = {
  're-menor-pentatonica': {
    name: 'Ré menor pentatónica',
    notes: [
      { name: 'Ré', freq: 293.66 },
      { name: 'Fá', freq: 349.23 },
      { name: 'Sol', freq: 392.00 },
      { name: 'Lá', freq: 440.00 },
      { name: 'Dó', freq: 523.25 },
    ],
  },
};

/* Naipes: 5 timbres × 10 lugares. octaveShift desloca a tessitura de
   cada naipe para uma região de frequência própria, evitando que
   50 telemóveis se acumulem na mesma zona. */
const SESSION_CONFIG = {
  scale: 're-menor-pentatonica',
  places: 50,
  placesPerSection: 10,
  instruments: {
    bells: {
      id: 'bells',
      label: '🔔 Bells',
      sub: 'Sino musical — brilho, registo agudo',
      notes: [0, 3],
      octaveShift: 1,   // uma oitava acima
    },
    handpan: {
      id: 'handpan',
      label: '🥁 Handpan',
      sub: 'Ataque suave, corpo tonal — registo médio',
      notes: [1, 4],
      octaveShift: 0,
    },
    fmbell: {
      id: 'fmbell',
      label: '✨ FM Bell',
      sub: 'Sino elétrico (FM) — brilho electrónico',
      notes: [2, 4],
      octaveShift: 1,
    },

    formant: {
      id: 'formant',
      label: '🗣 Coro Formant',
      sub: 'Vogal sintética — coro robótico',
      notes: [1, 3],
      octaveShift: 0,
    },
    pad: {
      id: 'pad',
      label: '🌌 Pad',
      sub: 'Textura electrónica quente — nuvem de sintetizadores',
      notes: [0, 4],
      octaveShift: 0,
    },
    pluck: {
      id: 'pluck',
      label: '💫 Pluck',
      sub: 'Pluck synth com filtro ressonante — electrónica analógica',
      notes: [2, 4],
      octaveShift: 1,
    },
    djembe: {
      id: 'djembe',
      label: '🪘 Djembé',
      sub: 'Percussão africana — grave seco e slap agudo',
      notes: [0, 4],
      octaveShift: -1,
    },
    cymbal: {
      id: 'cymbal',
      label: '🥁 Prato',
      sub: 'Percussão metálica — prato com decaimento longo',
      notes: [3, 4],
      octaveShift: 1,
    },
    shaker: {
      id: 'shaker',
      label: '🥫 Shaker · Maraca',
      sub: 'Sementes/chocalho — curto e vivo',
      notes: [2, 3],
      octaveShift: 1,
    },
    clap: {
      id: 'clap',
      label: '👏 Clap',
      sub: 'Palmas — corpo e presença',
      notes: [1, 3],
      octaveShift: 0,
    },
    timbales: {
      id: 'timbales',
      label: '🛢 Timbales',
      sub: 'Tambor latino metálico — casara e rim',
      notes: [0, 2],
      octaveShift: 0,
    },
    theremin: {
      id: 'theremin',
      label: '🕊 Theremin de Paz',
      sub: 'Um dedo para começar · dois em simultâneo — horizontal: nota · vertical: volume',
      octaveShift: 0,
    },

  },
};

/* Atribuição determinística de um lugar a naipe + 2 notas.
   Naipe = bloco de 10 lugares; notas = pares equilibrados cíclicos.
   O mesmo lugar tem sempre o mesmo naipe e as mesmas notas. */
const PLACE_NOTE_PAIRS = [[0, 3], [1, 4], [2, 3], [0, 4], [1, 2]];
/* theremin fica de fora da atribuição por lugar: é instrumento de
   melodia livre, escolhido a partir do menu (não tem 2 notas fixas). */
const SECTION_ORDER = ['bells', 'handpan', 'fmbell', 'formant', 'djembe'];

function assignPlace(place) {
  const scale = SCALES[SESSION_CONFIG.scale];
  const sectionIdx = Math.floor((place - 1) / SESSION_CONFIG.placesPerSection);
  const instrumentId = SECTION_ORDER[sectionIdx % SECTION_ORDER.length];
  const instrument = SESSION_CONFIG.instruments[instrumentId];
  const pair = PLACE_NOTE_PAIRS[(place - 1) % PLACE_NOTE_PAIRS.length];
  const octave = Math.pow(2, instrument.octaveShift || 0);
  return {
    place,
    instrumentId,
    instrument,
    notes: pair.map((i) => ({
      name: scale.notes[i].name,
      freq: scale.notes[i].freq * octave,
    })),
  };
}

/* ================================================================
   2. MOTOR DE ÁUDIO (Web Audio API)
   Cada telemóvel sintetiza e reproduz localmente os seus sons.
   Nenhuma dependência externa; funciona sem Internet.
   ================================================================ */

const AudioEngine = (() => {
  let ctx = null;
  let master = null;
  let reverb = null;
  let reverbGain = null;
  const MAX_NOTE_GROUPS = 8;
  let noteGroups = [];

  /* Samples reais (CC0, pack 'Percussion Samples' de Sassaby,
     freesound.org/people/Sassaby/packs/28352). Carregados sob
     pedido; se o ficheiro faltar ou falhar, os instrumentos usam a
     síntese. */
  const SAMPLES = {
    'djembe-grave': 'samples/509892__sassaby__bata-iya-tone.wav',
    'djembe-slap': 'samples/509893__sassaby__bata-iya-slap.wav',
    'cymbal-aberto': 'samples/545240__sassaby__china-trash-cymbal.wav',
    'cymbal-fechado': 'samples/512075__sassaby__electrocymbal-choke.wav',
    'shaker-seco': 'samples/506383__sassaby__shekere-hit.wav',
    'shaker-leve': 'samples/511272__sassaby__mele-slap.wav',
    'clap-forte': 'samples/531787__sassaby__caixa-vazada-hit.wav',
    'clap-suave': 'samples/531785__sassaby__caixa-rim-hit-side-stick.wav',
    'timbales-casara': 'samples/533095__sassaby__timbales-high-macho.wav',
    'timbales-rim': 'samples/533089__sassaby__timbales-high-rimshot-macho.wav',
  };
  const sampleBuffers = new Map();
  const sampleLoading = new Set();

  function loadSample(key) {
    if (sampleBuffers.has(key) || sampleLoading.has(key) || !SAMPLES[key]) {
      return;
    }
    sampleLoading.add(key);
    fetch(SAMPLES[key])
      .then((r) => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then((ab) => ensure().decodeAudioData(ab))
      .then((buf) => { sampleBuffers.set(key, buf); })
      .catch(() => { /* fica a síntese */ })
      .finally(() => { sampleLoading.delete(key); });
  }

  function playSample(key) {
    const buf = sampleBuffers.get(key);
    if (!buf) return false;
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + buf.duration);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = 1.0;
    src.connect(g).connect(master);
    src.start(t);
    group.gains.push(g);
    return true;
  }

  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      /* Reverb global: resposta ao impulso sintetizada (ruído com
         decaimento exponencial, 2,6 s) — sem ficheiros externos.
         Mix ~18% para dar espaço sem enlamear. */
      const revLen = Math.floor(ctx.sampleRate * 2.6);
      const revBuf = ctx.createBuffer(2, revLen, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = revBuf.getChannelData(ch);
        for (let i = 0; i < d.length; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.8);
        }
      }
      reverb = ctx.createConvolver();
      reverb.buffer = revBuf;
      reverbGain = ctx.createGain();
      reverbGain.gain.value = 0.18;
      reverb.connect(reverbGain).connect(ctx.destination);
      /* EQ espectral para colunas de telemóvel: as colunas pequenas
         reproduzem ~300 Hz-8 kHz. O corte de sub-grave (highpass
         120 Hz, 12 dB/oct) remove energia inaudível que só rouba
         headroom; o shelf de presença (+3,5 dB a 2,2 kHz) abre o
         espectro na zona onde estas colunas respondem melhor,
         dando brilho sem aumentar o pico. */
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 120;
      hp.Q.value = 0.7;
      const presence = ctx.createBiquadFilter();
      presence.type = 'peaking';
      presence.frequency.value = 2200;
      presence.Q.value = 0.9;
      presence.gain.value = 3.5;
      const air = ctx.createBiquadFilter();
      air.type = 'highshelf';
      air.frequency.value = 6500;
      air.gain.value = 2;
      /* Limitador suave no master: evita clipping (estalidos) quando
         várias vozes + reverb + volume do slider somam acima de 1.0. */
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -6;
      limiter.knee.value = 6;
      limiter.ratio.value = 12;
      limiter.attack.value = 0.003;
      limiter.release.value = 0.15;
      master.connect(hp);
      hp.connect(presence);
      presence.connect(air);
      air.connect(limiter).connect(ctx.destination);
      master.connect(reverb);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function isReady() {
    return !!(ctx && ctx.state === 'running');
  }

  function fadeOut(gainNode) {
    const now = ctx.currentTime;
    try {
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value, 0.0001), now);
      gainNode.gain.setTargetAtTime(0.0001, now, 0.06);
    } catch (_) {}
  }

  function pruneGroups() {
    const now = ctx.currentTime;
    noteGroups = noteGroups.filter((g) => g.stopTime > now);
  }

  function beginNote(stopTime) {
    const group = { gains: [], stopTime };
    pruneGroups();
    noteGroups.push(group);
    while (noteGroups.length > MAX_NOTE_GROUPS) {
      const oldest = noteGroups.shift();
      oldest.gains.forEach(fadeOut);
    }
    return group;
  }

  function partial(group, freq, t, peak, attack, decay, type) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + attack + decay + 0.1);
    group.gains.push(g);
  }

  /* Bells: parciais inarmónicos de sino (razões ~1 : 2.76 : 5.40 : 8.93),
     ataque rápido e decaimento longo — timbre metálico e ressonante. */
  function playBells(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 5.1);
    const ratios  = [1.0, 2.76, 5.40, 8.93];
    const peaks   = [0.20, 0.11, 0.05, 0.025];
    const decays  = [5.0, 3.4, 2.0, 1.1];
    ratios.forEach((r, i) => {
      partial(group, freq * r, t, peaks[i], 0.004, decays[i]);
    });
  }

  /* Handpan: fundamental dominante com oitava e quinta filtradas,
     ataque amortecido (~30 ms) e corpo ressonante longo. */
  function playHandpan(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;

    const attack = 0.03;
    const group = beginNote(t + attack + 4.7);

    const o1 = ctx.createOscillator();
    const g1 = ctx.createGain();
    o1.type = 'sine';
    o1.frequency.value = freq;
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.linearRampToValueAtTime(0.55, t + attack);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + attack + 4.5);
    o1.connect(g1).connect(master);
    o1.start(t); o1.stop(t + attack + 4.7);
    group.gains.push(g1);

    partial(group, freq * 2.0, t, 0.16, attack, 2.8);
    partial(group, freq * 3.0, t, 0.07, attack, 1.6);

    const o2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    o2.type = 'triangle';
    o2.frequency.value = freq * 1.5;
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(0.05, t + attack);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + attack + 1.2);
    o2.connect(g2).connect(master);
    o2.start(t); o2.stop(t + attack + 1.4);
    group.gains.push(g2);
  }

  /* FM Bell: síntese FM (modulador razão 3.5, índice decai rápido) —
     sino elétrico com clique metálico no ataque. */
  function playFMBell(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 3.2);

    const carrier = ctx.createOscillator();
    const modulator = ctx.createOscillator();
    const modGain = ctx.createGain();
    const g = ctx.createGain();
    carrier.type = 'sine';
    carrier.frequency.value = freq;
    modulator.type = 'sine';
    modulator.frequency.value = freq * 3.5;
    modGain.gain.setValueAtTime(freq * 2.2, t);
    modGain.gain.exponentialRampToValueAtTime(freq * 0.02, t + 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
    modulator.connect(modGain).connect(carrier.frequency);
    carrier.connect(g).connect(master);
    carrier.start(t); modulator.start(t);
    carrier.stop(t + 3.2); modulator.stop(t + 3.2);
    group.gains.push(g);
  }

  /* Djembé: membrana sintetizada. Botão 1 (nota baixa) = toque grave
     seco — seno com pitch bend descendente e ruído curto; botão 2
     (nota alta) = slap — ruído filtrado agudo com ressonância. */
  /* Pad: nuvem electrónica — 3 dente-de-serra desafinados com
     lowpass suave, ataque lento (1,2 s) e decaimento muito longo
     (8 s). Textura de fundo ambiente. */
  function playPad(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 9.5);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 2, t);
    lp.frequency.linearRampToValueAtTime(freq * 4, t + 3);
    lp.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.26, t + 1.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 8.5);

    [-7, 0, 7].forEach((cents) => {
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freq * Math.pow(2, cents / 1200);
      const og = ctx.createGain();
      og.gain.value = 1 / 3;
      o.connect(og).connect(lp);
      o.start(t); o.stop(t + 9);
    });
    lp.connect(g).connect(master);
    group.gains.push(g);
  }

  /* Pluck: dente-de-serra curto com lowpass RESSONANTE cujo cutoff
     desce com o envelope — ataque percussivo, carácter analógico
     (acid/synth pluck). */
  function playPluck(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 2.2);

    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = freq;
    /* Vibrato suave à semelhança do theremin: LFO 5,5 Hz com
       profundidade ~0,5% da fundamental. */
    const vib = ctx.createOscillator();
    const vibGain = ctx.createGain();
    vib.frequency.value = 5.5;
    vibGain.gain.value = freq * 0.005;
    vib.connect(vibGain).connect(o.frequency);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 12, t);
    lp.frequency.exponentialRampToValueAtTime(freq * 1.2, t + 0.35);
    lp.Q.value = 8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(lp).connect(g).connect(master);
    o.start(t); vib.start(t); o.stop(t + 1.8); vib.stop(t + 1.8);
    group.gains.push(g);
  }

  function playDjembe(freq, pad) {
    ensure();
    const t = ctx.currentTime + 0.005;

    if (pad === '0') {
      /* grave seco (bass) */
      const group = beginNote(t + 0.6);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * 1.35, t);
      o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.9, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 0.5);
      group.gains.push(g);

      /* corpo do tambor */
      const buf = ctx.createBuffer(1, 0.08 * ctx.sampleRate, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 500;
      const ng = ctx.createGain();
      ng.gain.value = 0.3;
      src.connect(lp).connect(ng).connect(master);
      src.start(t);
      group.gains.push(ng);
    } else {
      /* slap agudo */
      const group = beginNote(t + 0.35);
      const buf = ctx.createBuffer(1, 0.3 * ctx.sampleRate, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 5);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(freq * 4, t);
      bp.Q.value = 1.5;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.7, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      src.connect(bp).connect(ng).connect(master);
      src.start(t);
      group.gains.push(ng);

      /* ressonância da membrana */
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * 2.4, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.8, t + 0.05);
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 0.25);
      group.gains.push(g);
    }
  }

  /* Prato (cymbal): ruído com decaimento longo e brilho metálico —
     banda alta + shimmer. */
  function playCymbal(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 2.2);
    const dur = 2.0;
    const buf = ctx.createBuffer(1, dur * ctx.sampleRate, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = Math.max(freq * 2, 3000);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.85, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(hp).connect(g).connect(master);
    src.start(t);
    group.gains.push(g);
  }

  /* Shaker/Maraca: rajada curta de ruído filtrado, ataque vivo. */
  function playShaker(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 0.3);
    const dur = 0.22;
    const buf = ctx.createBuffer(1, dur * ctx.sampleRate, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const env = Math.sin(Math.PI * i / d.length);
      d[i] = (Math.random() * 2 - 1) * Math.pow(env, 0.7);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.max(freq * 6, 5000);
    bp.Q.value = 1.0;
    const g = ctx.createGain();
    g.gain.value = 0.85;
    src.connect(bp).connect(g).connect(master);
    src.start(t);
    group.gains.push(g);
  }

  /* Clap: múltiplas rajadas curtas sobrepostas (corpo de palmas) +
     caixa de ressonância média. */
  function playClap(freq) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 0.5);
    [0, 0.012, 0.025].forEach((offset, k) => {
      const dur = 0.12;
      const buf = ctx.createBuffer(1, dur * ctx.sampleRate, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = Math.max(freq * 3, 1200);
      bp.Q.value = 0.9;
      const g = ctx.createGain();
      g.gain.value = 0.75 / (k + 1);
      src.connect(bp).connect(g).connect(master);
      src.start(t + offset);
      group.gains.push(g);
    });
  }

  /* Timbales: casara (botão 1) — metal oco curto e brilhante;
     rim (botão 2) — aro com pitch definido. */
  function playTimbales(freq, pad) {
    ensure();
    const t = ctx.currentTime + 0.005;
    const group = beginNote(t + 1.0);

    if (pad === '0') {
      const dur = 0.5;
      const buf = ctx.createBuffer(1, dur * ctx.sampleRate, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 8);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(freq * 4, t);
      bp.frequency.exponentialRampToValueAtTime(freq * 1.8, t + 0.1);
      bp.Q.value = 1.8;
      const ng = ctx.createGain();
      ng.gain.value = 0.9;
      src.connect(bp).connect(ng).connect(master);
      src.start(t);
      group.gains.push(ng);
    } else {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq * 2.2, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.9, t + 0.04);
      g.gain.setValueAtTime(0.85, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 0.45);
      group.gains.push(g);
    }
  }

  /* Percussão: tenta o sample real; se ainda não carregado (ou
     falhou), usa a síntese e pede o sample em background para os
     próximos toques. */
  function playPercOrSample(instId, freq, pad, synthFn) {
    ensure();
    const keys = {
      djembe: ['djembe-grave', 'djembe-slap'],
      cymbal: ['cymbal-aberto', 'cymbal-fechado'],
      shaker: ['shaker-seco', 'shaker-leve'],
      clap: ['clap-forte', 'clap-suave'],
      timbales: ['timbales-casara', 'timbales-rim'],
    }[instId];
    const key = keys ? keys[Number(pad) || 0] : null;
    if (key) {
      if (playSample(key)) return;
      loadSample(key);
    }
    if (synthFn === playDjembe || synthFn === playTimbales) synthFn(freq, pad);
    else synthFn(freq);
  }

  function preloadPercussion(instId) {
    const keys = {
      djembe: ['djembe-grave', 'djembe-slap'],
      cymbal: ['cymbal-aberto', 'cymbal-fechado'],
      shaker: ['shaker-seco', 'shaker-leve'],
      clap: ['clap-forte', 'clap-suave'],
      timbales: ['timbales-casara', 'timbales-rim'],
    }[instId];
    if (keys) {
      ensure();
      keys.forEach(loadSample);
    }
  }

  /* Multitouch: cada dedo = uma voz independente (chaveada por
     pointerId). Acordes sob a mão, como no Etherpad. */
  const thereminVoices = new Map();

  /* Theremin estilo Etherpad: voz rica (seno dominante + triângulo
     suave + formante), vibrato lento, e brilho controlável pela
     posição X do dedo (drift). Cada toque = uma voz (multitouch,
     acordes sob a mão). Ao levantar, desvanece como um fôlego. */
  function startTheremin(freq, pointerId) {
    ensure();
    const t = ctx.currentTime;

    const o = ctx.createOscillator();
    const o2 = ctx.createOscillator();
    const g = ctx.createGain();
    const g2 = ctx.createGain();
    const vib = ctx.createOscillator();
    const vibGain = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    const form = ctx.createBiquadFilter();

    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(freq, t);
    g2.gain.value = 0.12;
    vib.frequency.value = 5.5;
    vibGain.gain.value = freq * 0.006;
    lp.type = 'lowpass';
    lp.frequency.value = Math.max(freq * 2.5, 600);
    lp.Q.value = 0.5;
    form.type = 'bandpass';
    form.frequency.value = Math.max(freq * 1.5, 400);
    form.Q.value = 1.2;
    const formGain = ctx.createGain();
    formGain.gain.value = 0.25;

    /* Dois gains separados: g = envelope de ataque/queda (nunca
       tocado durante a nota), gVol = volume expressivo do dedo.
       Antes, o setTargetAtTime do volume cancelava a rampa de
       ataque a meio — origem dos estalidos. */
    const gVol = ctx.createGain();
    gVol.gain.value = 0.6;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.32, t + 0.18);

    vib.connect(vibGain);
    vibGain.connect(o.frequency);
    vibGain.connect(o2.frequency);
    o.connect(lp);
    o2.connect(g2).connect(lp);
    lp.connect(g);
    lp.connect(form).connect(formGain).connect(g);
    g.connect(gVol).connect(master);
    /* Send de reverb próprio do theremin, mais presente que o mix
       global (18%): 40%. */
    const revSend = ctx.createGain();
    revSend.gain.value = 0.4;
    gVol.connect(revSend).connect(reverb);
    o.start(t); o2.start(t); vib.start(t);
    const voice = { o, o2, g, gVol, vib, vibGain, lp };
    const key = pointerId == null ? '_solo' : String(pointerId);
    stopTheremin(key);
    thereminVoices.set(key, voice);
  }

  function voiceFor(pointerId) {
    const key = pointerId == null ? '_solo' : String(pointerId);
    return thereminVoices.get(key);
  }

  function setThereminFreq(freq, pointerId) {
    const th = voiceFor(pointerId);
    if (!th) return;
    const t = ctx.currentTime;
    th.o.frequency.setTargetAtTime(freq, t, 0.03);
    th.o2.frequency.setTargetAtTime(freq, t, 0.03);
    th.vibGain.gain.setTargetAtTime(freq * 0.006, t, 0.03);
    th.lp.frequency.setTargetAtTime(Math.max(freq * 2.5, 600), t, 0.05);
  }

  /* Drift: brilho da voz pela posição X do dedo (0 = escuro,
     1 = brilhante) — moldar o timbre a tocar, como no Etherpad. */
  function setThereminTone(x01, pointerId) {
    const th = voiceFor(pointerId);
    if (!th) return;
    const t = ctx.currentTime;
    const base = th.o.frequency.value;
    const min = Math.max(base * 1.2, 400);
    const max = Math.max(base * 8, 2000);
    const f = min + (max - min) * Math.max(0, Math.min(1, x01));
    th.lp.frequency.setTargetAtTime(f, t, 0.08);
  }

  /* Volume expressivo (antena de volume do theremin): eixo horizontal
     do campo, 0 = quase silêncio, 1 = volume pleno. Curva suave. */
  function setThereminVolume(x01, pointerId) {
    const th = voiceFor(pointerId);
    if (!th) return;
    const t = ctx.currentTime;
    const v = Math.max(0, Math.min(1, x01));
    const curve = v * v; /* quadrática: mais controlo nos volumes baixos */
    th.gVol.gain.setTargetAtTime(0.001 + curve * 0.9, t, 0.06);
  }

  function stopTheremin(pointerId) {
    const key = pointerId == null ? '_solo' : String(pointerId);
    const th = thereminVoices.get(key);
    if (!th) {
      if (pointerId == null) stopAllTheremin();
      return;
    }
    thereminVoices.delete(key);
    const t = ctx.currentTime;
    try {
      th.g.gain.cancelScheduledValues(t);
      th.g.gain.setTargetAtTime(0.0001, t, 0.12);
      th.o.stop(t + 0.8);
      if (th.o2) th.o2.stop(t + 0.8);
      th.vib.stop(t + 0.8);
    } catch (_) {}
  }

  function stopAllTheremin() {
    for (const key of Array.from(thereminVoices.keys())) {
      stopTheremin(key);
    }
  }


  function play(instrumentId, freq) {
    if (instrumentId === 'bells') playBells(freq);
    else if (instrumentId === 'handpan') playHandpan(freq);
    else if (instrumentId === 'fmbell') playFMBell(freq);
    else if (instrumentId === 'pad') playPad(freq);
    else if (instrumentId === 'pluck') playPluck(freq);
    else if (instrumentId === 'formant') playFormant(freq);
    else if (instrumentId === 'djembe') playPercOrSample('djembe', freq, arguments[2], playDjembe);
    else if (instrumentId === 'cymbal') playPercOrSample('cymbal', freq, arguments[2], playCymbal);
    else if (instrumentId === 'shaker') playPercOrSample('shaker', freq, arguments[2], playShaker);
    else if (instrumentId === 'clap') playPercOrSample('clap', freq, arguments[2], playClap);
    else if (instrumentId === 'timbales') playPercOrSample('timbales', freq, arguments[2], playTimbales);
  }

  function setVolume(v) {
    if (master && typeof v === 'number' && v >= 0) master.gain.value = v * 0.9;
  }


  return {
    ensure, isReady, play, setVolume,
    startTheremin, setThereminFreq, setThereminTone, setThereminVolume, stopTheremin,
    preloadPercussion,
  };
})();

/* ================================================================
   3. INTERFACE
   ================================================================ */

const ui = {
  menu: document.getElementById('screen-menu'),
  instrument: document.getElementById('screen-instrument'),
  title: document.getElementById('instTitle'),
  sub: document.getElementById('instSub'),
  pads: document.getElementById('pads'),
  armHint: document.getElementById('armHint'),
  audioOff: document.getElementById('audioOff'),
  audioOn: document.getElementById('audioOn'),
  backBtn: document.getElementById('backBtn'),
};

let currentInstrument = null;
let armedPad = null;

/* Modo de execução: 'shake' (abanar, por defeito) ou 'tap' (o botão
   toca directamente — para telemóveis sem sensores ou com permissão
   de movimento indisponível). Persistente por lugar. */
let playMode = 'shake';

function modeKey() {
  return 'ob-mode-' + (placeAssignment ? placeAssignment.place : 'livre');
}

function loadPlayMode() {
  try {
    const m = localStorage.getItem(modeKey());
    if (m === 'shake' || m === 'tap') playMode = m;
  } catch (_) {}
  const shakeBtn = document.getElementById('modeShake');
  const tapBtn = document.getElementById('modeTap');
  shakeBtn.classList.toggle('sel', playMode === 'shake');
  tapBtn.classList.toggle('sel', playMode === 'tap');
  const hint = document.getElementById('armHint');
  if (hint) {
    hint.textContent = playMode === 'shake'
      ? 'Toca numa nota para armar · Agita o telemóvel para tocar'
      : 'Modo Toque: prime o botão para ouvir a nota';
  }
}

function setPlayMode(mode) {
  playMode = mode;
  try { localStorage.setItem(modeKey(), mode); } catch (_) {}
  if (armedPad) { armedPad.classList.remove('armed'); armedPad = null; }
  loadPlayMode();
}

document.getElementById('modeShake').addEventListener('click', () => setPlayMode('shake'));
document.getElementById('modeTap').addEventListener('click', () => setPlayMode('tap'));

function playArmed() {
  if (!armedPad || !currentInstrument) return;
  const freq = Number(armedPad.dataset.freq);
  const pad = armedPad.dataset.pad || '0';
  AudioEngine.ensure();
  updateAudioStatus();
  AudioEngine.play(currentInstrument, freq, pad);
  AudioEngine.play(currentInstrument, freq, pad);
  armedPad.classList.remove('ringing');
  void armedPad.offsetWidth;
  armedPad.classList.add('ringing');
}

/* Agitar o telemóvel dispara a nota armada.
   No iOS a permissão de movimento tem de ser pedida num gesto
   do utilizador — por isso é pedida ao armar a nota. */
const SHAKE_THRESHOLD = 8;
const SHAKE_COOLDOWN = 0.25;
/* Percussão (djembe) pede gesto mais decidido: limiar mais alto e
   pausa maior entre disparos, para dar controlabilidade. */
const SHAKE_THRESHOLD_PERC = 8;
const SHAKE_COOLDOWN_PERC = 0.22;
let lastShakeTime = 0;
let motionBound = false;

function shakeParams() {
  return ['djembe', 'cymbal', 'shaker', 'clap', 'timbales'].includes(currentInstrument)
    ? { th: SHAKE_THRESHOLD_PERC, cd: SHAKE_COOLDOWN_PERC }
    : { th: SHAKE_THRESHOLD, cd: SHAKE_COOLDOWN };
}

/* Detecção por TRANSIÇÃO (crossing): dispara quando a intensidade
   CRUZA o limiar de baixo para cima — cada golpe do abano (ida E
   volta do tchau-tchau) gera um toque. Cooldown adaptativo:
   baixo para percussão (0,14 s ≈ 4 toques/s = 240 BPM em colcheias),
   permitindo ritmos rápidos; maior nos naipes tonais. */
let shakeWasHigh = false;

function onMotion(e) {
  let mag;
  const lin = e.acceleration;
  if (lin && lin.x != null) {
    mag = Math.sqrt((lin.x || 0) ** 2 + (lin.y || 0) ** 2 + (lin.z || 0) ** 2);
  } else {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    const total = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
    mag = Math.abs(total - 9.8) * 1.2;
  }
  const now = Date.now() / 1000;
  const { th, cd } = shakeParams();
  const isHigh = mag > th;
  if (isHigh && !shakeWasHigh && now - lastShakeTime > cd) {
    lastShakeTime = now;
    playArmed();
  }
  shakeWasHigh = isHigh;
}

function bindMotion() {
  if (motionBound) return;
  motionBound = true;
  window.addEventListener('devicemotion', onMotion);
}

function motionSupported() {
  return typeof window.DeviceMotionEvent === 'function';
}

function motionNeedsExplicitPermission() {
  return motionSupported() &&
    typeof window.DeviceMotionEvent.requestPermission === 'function';
}

function requestMotionPermission(onResult) {
  if (motionBound) {
    if (onResult) onResult('already');
    return;
  }
  const DME = window.DeviceMotionEvent;
  if (!motionSupported()) {
    if (onResult) onResult('unsupported');
    return;
  }
  if (typeof DME.requestPermission === 'function') {
    DME.requestPermission().then((p) => {
      if (p === 'granted') {
        bindMotion();
        if (onResult) onResult('granted');
      } else {
        if (onResult) onResult('denied');
      }
    }).catch(() => {
      if (onResult) onResult('error');
    });
  } else {
    bindMotion();
    if (onResult) onResult('granted');
  }
}

function show(screen) {
  ui.menu.classList.toggle('active', screen === 'menu');
  ui.instrument.classList.toggle('active', screen === 'instrument');
}

function updateAudioStatus() {
  const ready = AudioEngine.isReady();
  ui.audioOff.style.display = ready ? 'none' : 'block';
  ui.audioOn.style.display = ready ? 'block' : 'none';
}

const PAD_COLORS = {
  bells: ['#7db8e8', '#e89d7d'],
  handpan: ['#e8c07d', '#9dc7a1'],
  fmbell: ['#c9a8e8', '#e8d47d'],
  formant: ['#e89dc4', '#c97da8'],
  pad: ['#9db8e8', '#b89de8'],
  pluck: ['#e8d47d', '#d4b8e8'],
  djembe: ['#c98a5d', '#8a5d3a'],
  cymbal: ['#d8c95d', '#b8a84a'],
  shaker: ['#9dc9b8', '#7db89d'],
  clap: ['#e8b87d', '#c99a5d'],
  timbales: ['#c97d7d', '#a85d5d'],
};

/* Rótulos dos 2 botões para instrumentos de percussão (não tonais). */
const PERC_LABELS = {
  djembe: ['GRAVE', 'SLAP'],
  cymbal: ['ABERTO', 'FECHADO'],
  shaker: ['SECO', 'LEVE'],
  clap: ['FORTE', 'SUAVE'],
  timbales: ['CASARA', 'RIM'],
};

/* Chave de sample por instrumento+botão de percussão. */
const PERC_SAMPLES = {
  djembe: ['djembe-grave', 'djembe-slap'],
  cymbal: ['cymbal-aberto', 'cymbal-fechado'],
  shaker: ['shaker-seco', 'shaker-leve'],
  clap: ['clap-forte', 'clap-suave'],
  timbales: ['timbales-casara', 'timbales-rim'],
};

function openInstrument(instId, noteObjs, place) {
  const inst = SESSION_CONFIG.instruments[instId];
  if (!inst) return;
  currentInstrument = instId;

  const scale = SCALES[SESSION_CONFIG.scale];
  ui.title.textContent = inst.label + (place ? ' · Lugar ' + place : '');
  ui.sub.textContent = inst.sub + ' — escala: ' + scale.name;

  if (instId === 'theremin') {
    openTheremin(inst, scale);
    loadVolume();
    updateAudioStatus();
    show('instrument');
    return;
  }



  restorePadsIfTheremin();

  if (PERC_LABELS[instId]) {
    try { AudioEngine.preloadPercussion(instId); } catch (_) {}
  }

  const octave = Math.pow(2, inst.octaveShift || 0);
  const notes = noteObjs || inst.notes.map((i) => ({
    name: scale.notes[i].name,
    freq: scale.notes[i].freq * octave,
  }));
  ui.pads.innerHTML = '';
  armedPad = null;
  notes.forEach((note, i) => {
    const percLabels = PERC_LABELS[instId];
    const btn = document.createElement('button');
    btn.className = 'note-pad';
    btn.style.background = (PAD_COLORS[instId] || ['#7db8e8'])[i] || '#7db8e8';
    btn.dataset.freq = String(note.freq);
    btn.dataset.pad = String(i);
    btn.innerHTML =
      '<span class="note-name">' + (percLabels ? percLabels[i] : note.name) + '</span>' +
      '<span class="note-hint">toca para armar — agita para tocar</span>';

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      AudioEngine.ensure();
      updateAudioStatus();
      if (playMode === 'tap') {
        /* Modo Toque: o botão toca directamente ao premir. */
        const freq = Number(btn.dataset.freq);
        const pad = btn.dataset.pad || '0';
        AudioEngine.play(instId, freq, pad);
        btn.classList.remove('ringing');
        void btn.offsetWidth;
        btn.classList.add('pressed', 'ringing');
      } else {
        /* Modo Abanar: o toque arma a nota; agitar toca. */
        if (armedPad === btn) {
          armedPad = null;
          btn.classList.remove('armed');
        } else {
          if (armedPad) armedPad.classList.remove('armed');
          armedPad = btn;
          btn.classList.add('armed');
        }
        requestMotionPermission((r) => { if (r === 'granted') updateMotionBtn(); });
      }
      lockPortrait();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
      btn.addEventListener(ev, () => btn.classList.remove('pressed'));
    });

    ui.pads.appendChild(btn);
  });

  loadVolume();
  updateAudioStatus();
  updateMotionBtn();
  loadPlayMode();
  show('instrument');
}

/* ================================================================
   SORTEIO — um link, um botão: cada participante carrega e recebe
   aleatoriamente o seu instrumento. Fica guardado no telemóvel
   (sorteado = "o meu instrumento"). Sorteios repetidos permitidos:
   carregar de novo dá um instrumento novo (para re-jogar).
   ================================================================ */

const SORTEABLE = ['bells', 'handpan', 'fmbell', 'formant',
                   'pad', 'pluck',
                   'djembe', 'cymbal', 'shaker', 'clap', 'timbales'];
const sorteioBtn = document.getElementById('sorteioBtn');

sorteioBtn.addEventListener('click', () => {
  const instId = SORTEABLE[Math.floor(Math.random() * SORTEABLE.length)];
  try { localStorage.setItem('ob-sorteado', instId); } catch (_) {}
  openInstrument(instId);
});

document.querySelectorAll('.choose-btn').forEach((b) => {
  b.addEventListener('click', () => openInstrument(b.dataset.inst));
});

/* Modo config do maestro: ?config=1 revela a escolha livre. Sem
   ele, o participante vê apenas o sorteio — 'Trocar de instrumento'
   volta à página do dado (novo sorteio). */
const isConfigMode = new URLSearchParams(location.search).get('config') === '1';
if (isConfigMode) {
  document.getElementById('freeChoice').style.display = '';
}

ui.backBtn.addEventListener('click', () => {
  if (placeAssignment) {
    show('instrument');
    return;
  }
  currentInstrument = null;
  show('menu');
});

/* Slider de volume por lugar — guardado no telemóvel (localStorage),
   sob a chave do lugar quando existe, ou global caso contrário. */
/* ================================================================
   3d. THEREMIN — melodia livre por arrasto
   Campo de toque vertical: a altura do dedo escolhe a nota
   (quantizada à escala, 2 oitavas), o som só existe enquanto o
   dedo está no campo. Ao sair, desvanece em ~0,4 s. Marca visual
   segue o dedo; nota actual destaca-se.
   ================================================================ */

/* ================================================================
   3e. GROOVE BOX — motivos rítmicos em loop com controlo de BPM.
   Substitui os pads por controlos: play/stop, escolha de motivo e
   BPM. O loop corre no motor de áudio; este ecrã só comanda.
   ================================================================ */

let thereminLayoutHandler = null;

function restorePadsIfTheremin() {
  document.body.classList.remove('allow-landscape');
  const oldField = document.querySelector('[data-theremin]');
  if (oldField) {
    if (thereminLayoutHandler) {
      window.removeEventListener('resize', thereminLayoutHandler);
      thereminLayoutHandler = null;
    }
    AudioEngine.stopTheremin();
    const pads = document.createElement('div');
    pads.className = 'note-pads';
    pads.id = 'pads';
    oldField.replaceWith(pads);
    ui.pads = pads;
    ui.armHint.style.display = '';
  }
}

function openTheremin(inst, scale) {
  restorePadsIfTheremin();
  armedPad = null;
  ui.armHint.style.display = 'none';
  document.body.classList.add('allow-landscape');
  const relayout = () => {
    const evt = new Event('resize');
    window.dispatchEvent(evt);
  };
  setTimeout(relayout, 100);
  setTimeout(relayout, 400);

  const field = document.createElement('div');
  field.className = 'theremin-field';
  /* Multitouch: uma bola e um estado por dedo (pointerId). */
  const spots = new Map();
  function spotFor(pointerId) {
    const key = String(pointerId);
    if (!spots.has(key)) {
      const s = document.createElement('div');
      s.className = 'theremin-spot';
      field.appendChild(s);
      spots.set(key, { el: s, lastIdx: -1 });
    }
    return spots.get(key);
  }

  const octave = Math.pow(2, inst.octaveShift || 0);
  /* Gerar da mais GRAVE para a mais AGUDA: coluna 0 = esquerda,
     portanto Ré grave à esquerda e Dó↑ agudo à direita (como um
     piano: grave à esquerda). */
  const rows = [];
  for (let oct = 0; oct <= 1; oct++) {
    scale.notes.forEach((n) => {
      rows.push({
        name: n.name + (oct === 1 ? '↑' : ''),
        freq: n.freq * octave * Math.pow(2, oct),
      });
    });
  }

  /* Como no Etherpad: pitch na HORIZONTAL (arrastar para os lados =
     melodia), brilho na VERTICAL (cima = mais brilhante).
     As colunas de nota são dispostas lado a lado. */
  const noteEls = [];
  rows.forEach((row, i) => {
    const el = document.createElement('div');
    el.className = 'theremin-note';
    el.textContent = row.name;
    field.appendChild(el);
    noteEls.push(el);
  });

  const layout = () => {
    const w = field.clientWidth;
    const step = w / rows.length;
    noteEls.forEach((el, i) => {
      el.style.left = (i * step) + 'px';
      el.style.width = step + 'px';
      el.style.borderLeft = '1px dashed rgba(255,255,255,.18)';
    });
  };

  const freqFromX = (clientX) => {
    const rect = field.getBoundingClientRect();
    const step = rect.width / rows.length;
    const idx = Math.max(0, Math.min(rows.length - 1,
      Math.floor((clientX - rect.left) / step)));
    return { freq: rows[idx].freq, idx };
  };

  const highlight = (idx) => {
    noteEls.forEach((el, i) => el.classList.toggle('sel', i === idx));
  };

  let playing = false;

  field.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    AudioEngine.ensure();
    updateAudioStatus();
    const { freq, idx } = freqFromX(e.clientX);
    AudioEngine.startTheremin(freq, e.pointerId);
    const rect = field.getBoundingClientRect();
    AudioEngine.setThereminVolume(1 - (e.clientY - rect.top) / rect.height, e.pointerId);
    playing = true;
    const spot = spotFor(e.pointerId);
    spot.lastIdx = idx;
    highlight(idx);
    spot.el.style.display = 'block';
    spot.el.style.left = (e.clientX - rect.left) + 'px';
    spot.el.style.top = (e.clientY - rect.top) + 'px';
    field.setPointerCapture(e.pointerId);
  });
  field.addEventListener('pointermove', (e) => {
    if (!playing) return;
    const spot = spots.get(String(e.pointerId));
    if (!spot) return;
    const rect = field.getBoundingClientRect();
    spot.el.style.left = (e.clientX - rect.left) + 'px';
    spot.el.style.top = (e.clientY - rect.top) + 'px';
    const { freq, idx } = freqFromX(e.clientX);
    if (idx !== spot.lastIdx) {
      AudioEngine.setThereminFreq(freq, e.pointerId);
      spot.lastIdx = idx;
      highlight(idx);
    }
    /* Volume expressivo: Y do dedo = antena de volume
       (cima = forte, baixo = suave). */
    AudioEngine.setThereminVolume(1 - (e.clientY - rect.top) / rect.height, e.pointerId);
  });
  const end = (e) => {
    const key = String(e.pointerId);
    const spot = spots.get(key);
    if (spot) {
      spot.el.style.display = 'none';
      spots.delete(key);
    }
    AudioEngine.stopTheremin(e.pointerId);
    if (spots.size === 0) highlight(-1);
  };
  field.addEventListener('pointerup', end);
  field.addEventListener('pointercancel', end);

  ui.pads.replaceWith(field);
  ui.pads = field;
  field.dataset.theremin = '1';
  /* layout após o ecrã estar visível: no momento da chamada o ecrã
     ainda está display:none e clientHeight seria 0. requestAnimationFrame
     corre depois de show('instrument') ter activado o ecrã. */
  requestAnimationFrame(() => { layout(); layout(); });
  thereminLayoutHandler = layout;
  window.addEventListener('resize', layout);
}

/* Botão explícito de activação de movimento (iOS/Safari e Chrome iOS):
   o pedido de permissão tem de nascer de um gesto claro do utilizador
   com feedback visível — nem sempre o toque de armar chega a mostrar
   o diálogo do sistema. */
const motionBtn = document.getElementById('motionBtn');

function updateMotionBtn() {
  if (motionBound) {
    motionBtn.style.display = 'none';
    return;
  }
  if (motionNeedsExplicitPermission()) {
    motionBtn.style.display = 'block';
    motionBtn.className = 'motion-btn';
    motionBtn.textContent = '📳 Ativar agitar no iPhone';
  }
}

motionBtn.addEventListener('click', () => {
  requestMotionPermission((result) => {
    if (result === 'granted' || result === 'already') {
      motionBtn.classList.add('ok');
      motionBtn.textContent = '✓ Agitar ativado';
      setTimeout(() => { motionBtn.style.display = 'none'; }, 1600);
    } else if (result === 'denied') {
      motionBtn.classList.add('err');
      motionBtn.textContent = '✗ Permissão recusada — vê Definições > Safari';
    } else {
      motionBtn.classList.add('err');
      motionBtn.textContent = '✗ Não foi possível ativar';
    }
  });
});

const volSlider = document.getElementById('volSlider');
function volumeKey() {
  return 'ob-vol-' + (placeAssignment ? placeAssignment.place : 'livre');
}
function loadVolume() {
  try {
    const v = parseFloat(localStorage.getItem(volumeKey()));
    if (!isNaN(v)) volSlider.value = String(v);
  } catch (_) {}
  AudioEngine.setVolume(parseFloat(volSlider.value));
}
volSlider.addEventListener('input', () => {
  AudioEngine.setVolume(parseFloat(volSlider.value));
  try { localStorage.setItem(volumeKey(), volSlider.value); } catch (_) {}
});

/* ================================================================
   3c. MODO LUGAR (?lugar=N)
   Link permanente por lugar da orquestra (para QR codes).
   A atribuição é calculada localmente — sem servidor.
   Ex.: https://.../?lugar=7 abre já o instrumento do lugar 7.
   ================================================================ */

/* Bloqueio de orientação vertical: apenas possível em ecrã inteiro e
   apenas suportado em Android/Chrome. O primeiro toque pede ecrã
   inteiro + bloqueio 'portrait'. No iOS/Safari não é suportado —
   o overlay de rotação cobre esses casos. */
let portraitLockTried = false;

function lockPortrait() {
  if (portraitLockTried) return;
  portraitLockTried = true;
  const el = document.documentElement;
  const requestFS = el.requestFullscreen || el.webkitRequestFullscreen;
  if (typeof requestFS !== 'function') return;
  requestFS.call(el).then(() => {
    if (screen.orientation && typeof screen.orientation.lock === 'function') {
      screen.orientation.lock('portrait').catch(() => {
        /* navegador recusou — o overlay continua a cobrir */
      });
    }
  }).catch(() => {
    /* ecrã inteiro recusado — continuar com overlay */
  });
}

const placeParams = new URLSearchParams(location.search);
/* free-choice: só se abre depois de placeParams existir; o botão de
   back e o sorteio referem-no adiante. */
const placeNum = parseInt(placeParams.get('lugar'), 10);
let placeAssignment = null;

if (Number.isInteger(placeNum) && placeNum >= 1 && placeNum <= SESSION_CONFIG.places) {
  placeAssignment = assignPlace(placeNum);
  openPlace(placeAssignment);
}
/* Sem lugar por QR: mostrar sempre a página do dado — mesmo quem já
   tem instrumento sorteado volta a vê-lo. O participante carrega no
   dado e recebe um instrumento (novo sorteio). O anterior deixa de
   ser relevante: a experiência correcta é sempre passar pelo dado. */

function openPlace(assignment) {
  openInstrument(assignment.instrumentId, assignment.notes, assignment.place);
}

/* ================================================================
   4. REDE (opcional na v1)
   Apenas contador de dispositivos ligados. A reprodução é 100%
   local — se o SSE falhar, o instrumento continua a funcionar.
   ================================================================ */

try {
  const es = new EventSource('/events');
  const dot = document.getElementById('dot');
  const cnt = document.getElementById('cnt');
  es.onopen = () => dot.classList.add('on');
  es.onerror = () => { dot.classList.remove('on'); cnt.textContent = 'offline'; };
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'count') cnt.textContent = msg.count + ' 📱';
    } catch (_) {}
  };
} catch (_) { /* reprodução local continua sem rede */ }
</script>
