<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- Padrão keffiyeh vectorial: malha de rede diagonal + motivos
       clássicos (ave/folha estilizada em fila). Fundo tecido claro,
       desenho preto. Repetido como fundo do Theremin de Paz. -->
  <rect width="140" height="140" fill="#f5f2ea"/>

  <!-- Malha de rede (fishnet) diagonal -->
  <g stroke="#141419" stroke-width="1.6" opacity="0.55">
    <line x1="-10" y1="10" x2="10" y2="-10"/>
    <line x1="0" y1="20" x2="20" y2="0"/>
    <line x1="10" y1="30" x2="30" y2="10"/>
    <line x1="20" y1="40" x2="40" y2="20"/>
    <line x1="30" y1="50" x2="50" y2="30"/>
    <line x1="40" y1="60" x2="60" y2="40"/>
    <line x1="50" y1="70" x2="70" y2="50"/>
    <line x1="60" y1="80" x2="80" y2="60"/>
    <line x1="70" y1="90" x2="90" y2="70"/>
    <line x1="80" y1="100" x2="100" y2="80"/>
    <line x1="90" y1="110" x2="110" y2="90"/>
    <line x1="100" y1="120" x2="120" y2="100"/>
    <line x1="110" y1="130" x2="130" y2="110"/>
    <line x1="120" y1="140" x2="140" y2="120"/>
    <line x1="130" y1="150" x2="150" y2="130"/>
    <line x1="10" y1="10" x2="-10" y2="30"/>
    <line x1="20" y1="20" x2="0" y2="40"/>
    <line x1="30" y1="30" x2="10" y2="50"/>
    <line x1="40" y1="40" x2="20" y2="60"/>
    <line x1="50" y1="50" x2="30" y2="70"/>
    <line x1="60" y1="60" x2="40" y2="80"/>
    <line x1="70" y1="70" x2="50" y2="90"/>
    <line x1="80" y1="80" x2="60" y2="100"/>
    <line x1="90" y1="90" x2="70" y2="110"/>
    <line x1="100" y1="100" x2="80" y2="120"/>
    <line x1="110" y1="110" x2="90" y2="130"/>
    <line x1="120" y1="120" x2="100" y2="140"/>
    <line x1="130" y1="130" x2="110" y2="150"/>
    <line x1="140" y1="140" x2="120" y2="160"/>
  </g>

  <!-- Motivo clássico: ave/folha estilizada (fila central) -->
  <g fill="#141419">
    <path d="M 70 30
             L 78 38 L 74 44 L 82 50 L 74 56 L 70 62
             L 66 56 L 58 50 L 66 44 L 62 38 Z" opacity="0.9"/>
    <rect x="69" y="22" width="2" height="6"/>
    <rect x="69" y="64" width="2" height="6"/>
  </g>
  <g stroke="#141419" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M 70 62 L 70 78"/>
    <path d="M 64 74 L 70 70 L 76 74"/>
  </g>
</svg>
